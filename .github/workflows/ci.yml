name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync CPU environment
        run: uv sync --locked --extra cpu --group dev

      - name: Ruff lint
        run: uv run --extra cpu ruff check .

      - name: Ruff format
        run: uv run --extra cpu ruff format --check .

      - name: Compile Python
        run: uv run --extra cpu python -m compileall -q src scripts

      - name: Tests
        run: uv run --extra cpu pytest -q --durations=10

      - name: Build package
        run: uv build

  model-smoke:
    name: Model smoke / seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 23]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync CPU environment
        run: uv sync --locked --extra cpu --group dev

      - name: World-model smoke train
        run: uv run --extra cpu scai smoke-train --steps 10 --device cpu --seed ${{ matrix.seed }}

      - name: Deterministic dynamics benchmark
        run: |
          mkdir -p artifacts
          uv run --extra cpu scai benchmark-synthetic             --profile tiny             --steps 25             --seed ${{ matrix.seed }}             --device cpu             --output artifacts/benchmark.json
          cat artifacts/benchmark.json
