name: Sync uv lockfile

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/lockfile.yml

permissions:
  contents: write

concurrency:
  group: uv-lockfile
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Resolve lockfile
        run: uv lock

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv lockfile"
          git push origin HEAD:main
