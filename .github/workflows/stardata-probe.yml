name: StarData source probe

on:
  pull_request:
    paths:
      - ".github/workflows/stardata-probe.yml"
      - "tools/stardata_reader.cpp"
      - "extractor/headless/src/bin/replay_actions.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Probe StarData public endpoints
        shell: bash
        run: |
          mkdir -p artifacts
          set +e

          probe_head() {
            name="$1"
            url="$2"
            echo "## $name" >> artifacts/report.md
            echo "$url" >> artifacts/report.md
            code="$(curl -LIsS --max-time 30 -o "artifacts/$name.headers" -w '%{http_code}' "$url")"
            status=$?
            echo "curl_status=$status http_code=$code" >> artifacts/report.md
            echo "" >> artifacts/report.md
          }

          probe_head "train-list" "https://dl.fbaipublicfiles.com/stardata/dumped_replays/train.list"
          probe_head "chunk-0" "https://dl.fbaipublicfiles.com/stardata/dumped_replays/0.tar.gz"
          probe_head "direct-first-tcr" "https://dl.fbaipublicfiles.com/stardata/dumped_replays/0/bwrep_065pa.tcr"
          probe_head "s3-virtual" "https://stardata.s3.amazonaws.com/?list-type=2&max-keys=20"
          probe_head "s3-path" "https://s3.amazonaws.com/stardata/?list-type=2&max-keys=20"

          curl -LfsS --max-time 30 \
            "https://dl.fbaipublicfiles.com/stardata/dumped_replays/train.list" \
            -o artifacts/train.list
          train_status=$?
          echo "train_list_download_status=$train_status" >> artifacts/report.md

          curl -LfsS --max-time 60 \
            "https://dl.fbaipublicfiles.com/stardata/dumped_replays/0/bwrep_065pa.tcr" \
            -o artifacts/first.tcr
          direct_status=$?
          direct_size="$(wc -c < artifacts/first.tcr 2>/dev/null || echo 0)"
          echo "direct_tcr_download_status=$direct_status size=$direct_size" >> artifacts/report.md

          if [ -s artifacts/train.list ]; then
            echo "" >> artifacts/report.md
            echo "## train.list first 30 lines" >> artifacts/report.md
            echo "BEGIN_TRAIN_LIST" >> artifacts/report.md
            head -30 artifacts/train.list >> artifacts/report.md
            echo "END_TRAIN_LIST" >> artifacts/report.md
          fi

          echo "" >> artifacts/report.md
          echo "## bounded chunk range probe" >> artifacts/report.md
          range_code="$(curl -LIsS --max-time 30 -H "Range: bytes=0-67108863" -o artifacts/range.headers -w '%{http_code}' "https://dl.fbaipublicfiles.com/stardata/dumped_replays/0.tar.gz")"
          echo "range_http_code=$range_code" >> artifacts/report.md
          get_meta="$(curl -LfsS --max-time 60 --range 0-1048575 --max-filesize 2097152 -o artifacts/range-get.bin -w 'code=%{http_code} bytes=%{size_download}' "https://dl.fbaipublicfiles.com/stardata/dumped_replays/0.tar.gz")"
          get_status=$?
          echo "range_get_status=$get_status $get_meta" >> artifacts/report.md
          rm -f artifacts/range-get.bin
          if [ "$get_status" -eq 0 ] && echo "$get_meta" | grep -q "code=206"; then
            curl -LfsS --max-time 180 --range 0-67108863 --max-filesize 70000000 \
              "https://dl.fbaipublicfiles.com/stardata/dumped_replays/0.tar.gz" \
              -o artifacts/chunk0-prefix.tar.gz
            prefix_size="$(wc -c < artifacts/chunk0-prefix.tar.gz)"
            echo "range_bytes=$prefix_size" >> artifacts/report.md
            if [ "$prefix_size" -le 70000000 ]; then
              gzip -dc artifacts/chunk0-prefix.tar.gz > artifacts/chunk0-prefix.tar 2>artifacts/gzip-partial.err
              gzip_status=$?
              echo "partial_gzip_status=$gzip_status" >> artifacts/report.md
              tar -tf artifacts/chunk0-prefix.tar > artifacts/tar-list.txt 2>artifacts/tar-list.err
              tar_status=$?
              echo "partial_tar_status=$tar_status" >> artifacts/report.md
              first_tcr="$(grep -m1 "[.]tcr" artifacts/tar-list.txt)"
              echo "first_tar_member=$first_tcr" >> artifacts/report.md
              if [ -n "$first_tcr" ]; then
                tar -xOf artifacts/chunk0-prefix.tar "$first_tcr" > artifacts/sample.tcr 2>artifacts/tar-extract.err
                extract_status=$?
                sample_size="$(wc -c < artifacts/sample.tcr 2>/dev/null || echo 0)"
                echo "sample_extract_status=$extract_status sample_size=$sample_size" >> artifacts/report.md
              fi
            else
              echo "range guard failed: server returned too much data" >> artifacts/report.md
            fi
          else
            echo "GET range unsupported; partial extraction skipped" >> artifacts/report.md
          fi

          echo "" >> artifacts/report.md
          echo "## original replay pair probe" >> artifacts/report.md
          original_meta="$(curl -LfsS --max-time 90 --range 0-134217727 --max-filesize 140000000 -o artifacts/original-prefix.tar.gz -w 'code=%{http_code} bytes=%{size_download}' "https://dl.fbaipublicfiles.com/stardata/original_replays.tar.gz")"
          original_status=$?
          echo "original_range_status=$original_status $original_meta" >> artifacts/report.md
          if [ "$original_status" -eq 0 ] && echo "$original_meta" | grep -q "code=206"; then
            gzip -dc artifacts/original-prefix.tar.gz > artifacts/original-prefix.tar 2>artifacts/original-gzip.err
            tar -tf artifacts/original-prefix.tar > artifacts/original-list.txt 2>artifacts/original-tar.err
            first_rep="$(grep -m1 "[.]rep$" artifacts/original-list.txt)"
            paired_rep="$(grep -m1 "bwrep_bqrdp[.]rep$" artifacts/original-list.txt)"
            echo "first_original_member=$first_rep" >> artifacts/report.md
            echo "paired_original_member=$paired_rep" >> artifacts/report.md
            if [ -n "$paired_rep" ]; then
              tar -xOf artifacts/original-prefix.tar "$paired_rep" > artifacts/paired.rep 2>artifacts/original-extract.err
              paired_size="$(wc -c < artifacts/paired.rep 2>/dev/null || echo 0)"
              echo "paired_original_size=$paired_size" >> artifacts/report.md
            fi
          fi
          rm -f artifacts/original-prefix.tar artifacts/original-prefix.tar.gz
          rm -f artifacts/chunk0-prefix.tar artifacts/chunk0-prefix.tar.gz
          cat artifacts/report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Checkout TorchCraft source
        uses: actions/checkout@v7.0.1
        with:
          repository: TorchCraft/TorchCraft
          ref: 8f09ba0a8425b172b1c2700f242afa24336e7237
          path: external/torchcraft

      - name: Build standalone StarData reader
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzstd-dev
          g++ -std=c++17 -O2 -DWITH_ZSTD -include limits \
            -I external/torchcraft/include \
            -I external/torchcraft/replayer \
            -I external/torchcraft/BWEnv/fbs \
            tools/stardata_reader.cpp \
            external/torchcraft/replayer/replayer.cpp \
            external/torchcraft/replayer/frame.cpp \
            external/torchcraft/replayer/frame_serialization.cpp \
            external/torchcraft/replayer/frame_diff.cpp \
            external/torchcraft/replayer/frame_diff_serialization.cpp \
            -lzstd \
            -o artifacts/stardata-reader

      - name: Parse extracted StarData sample
        shell: bash
        run: |
          test -s artifacts/sample.tcr
          artifacts/stardata-reader artifacts/sample.tcr \
            --frames-jsonl artifacts/sample-states.jsonl \
            | tee artifacts/sample-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/sample-summary.json").read_text())
          assert data["frames"] > 0
          assert len(data["player_ids"]) >= 2
          assert data["max_units"] > 0
          assert data["first_nonempty_frame"] >= 0
          assert data["order_events"] > 0
          assert data["last"]["units"] > 0

          states = [
              json.loads(line)
              for line in Path("artifacts/sample-states.jsonl").read_text().splitlines()
              if line
          ]
          assert len(states) == data["frames"]
          assert states[0]["sample_index"] == 0
          assert states[-1]["sample_index"] == data["frames"] - 1
          assert states[100]["approx_game_frame"] == 300
          assert any(state["units"] for state in states)
          assert any(state["resources"] for state in states)
          print(json.dumps({
              "summary": data,
              "state_rows": len(states),
              "first_nonempty_state": next(
                  state["sample_index"] for state in states if state["units"]
              ),
          }, indent=2))
          PY
      - name: Parse paired original replay
        shell: bash
        run: |
          test -s artifacts/paired.rep
          cargo build --release --manifest-path extractor/headless/Cargo.toml
          extractor/headless/target/release/scai-headless-extractor \
            --replay artifacts/paired.rep \
            --output artifacts/paired-transitions.jsonl \
            --manifest artifacts/paired-replay-manifest.json \
            --synthetic \
            --max-frames 3000
          python - <<'PY'
          import json
          from pathlib import Path

          sample = json.loads(Path("artifacts/sample-summary.json").read_text())
          manifest = json.loads(Path("artifacts/paired-replay-manifest.json").read_text())
          expected = sample["frames"] * 3
          delta = abs(manifest["replay_frames"] - expected)
          result = {
              "tcr_frames": sample["frames"],
              "expected_rep_frames": expected,
              "rep_frames": manifest["replay_frames"],
              "frame_delta": delta,
              "replay_commands": manifest["replay_commands"],
              "emitted_actions": manifest["emitted_actions"],
              "map_name": manifest["map_name"],
          }
          Path("artifacts/pair-check.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          assert manifest["replay_commands"] > 0
          assert manifest["emitted_actions"] > 0
          assert delta <= 12
          PY
      - name: Dump paired replay actions
        shell: bash
        run: |
          cargo run --release --manifest-path extractor/headless/Cargo.toml \
            --bin replay_actions -- \
            --replay artifacts/paired.rep \
            --output artifacts/paired-actions.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              json.loads(line)
              for line in Path("artifacts/paired-actions.jsonl").read_text().splitlines()
              if line
          ]
          assert len(rows) > 300
          assert all(row["frame"] >= 0 for row in rows)
          assert all("selected_unit_tags" in row for row in rows)
          assert any(row["selected_unit_tags"] for row in rows)

          players = sorted({row["player_id"] for row in rows})
          kinds = {}
          for row in rows:
              command = row["command"]
              kind = next(iter(command)) if isinstance(command, dict) else str(command)
              kinds[kind] = kinds.get(kind, 0) + 1

          summary = {
              "actions": len(rows),
              "players": players,
              "first_frame": rows[0]["frame"],
              "last_frame": rows[-1]["frame"],
              "actions_with_selected_units": sum(bool(row["selected_unit_tags"]) for row in rows),
              "command_kinds": kinds,
          }
          Path("artifacts/paired-actions-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload probe report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stardata-source-probe
          path: artifacts/
          retention-days: 3
          if-no-files-found: error
