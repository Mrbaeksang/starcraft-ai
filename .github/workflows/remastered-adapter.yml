name: Remastered adapter

on:
  push:
    branches: [main]
    paths:
      - "runtime/remastered_adapter/**"
      - "runtime/windows/**"
      - ".github/workflows/remastered-adapter.yml"
  pull_request:
    paths:
      - "runtime/remastered_adapter/**"
      - "runtime/windows/**"
      - ".github/workflows/remastered-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/remastered_adapter
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: runtime/remastered_adapter/go.mod
          cache: false
      - name: Test manifest fail-closed behavior
        run: go test ./...
      - name: Test persistent foreground bridge protocol
        run: python3 -m unittest discover -s . -p 'test_*.py'
      - name: Cross-compile Windows x64 adapter probe
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/remastered-adapter.exe .

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile Windows interop and reject malformed manifest
        shell: powershell
        run: ./runtime/windows/test_contract.ps1
