name: Headless replay extractor

on:
  pull_request:
    paths:
      - "extractor/headless/**"
      - "src/starcraft_ai/data/**"
      - "tests/fixtures/**"
      - ".github/workflows/headless-extractor.yml"
  push:
    branches: [main]
    paths:
      - "extractor/headless/**"
      - "src/starcraft_ai/data/**"
      - "tests/fixtures/**"
      - ".github/workflows/headless-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-real-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Build pinned headless extractor
        run: cargo build --release --manifest-path extractor/headless/Cargo.toml

      - name: Extract the real replay fixture twice
        run: |
          mkdir -p artifacts
          BIN=extractor/headless/target/release/scai-headless-extractor
          "$BIN"             --replay tests/fixtures/larva_vs_mini.rep             --output artifacts/first.jsonl             --manifest artifacts/first.manifest.json             --synthetic             --max-frames 3000
          "$BIN"             --replay tests/fixtures/larva_vs_mini.rep             --output artifacts/second.jsonl             --manifest artifacts/second.manifest.json             --synthetic             --max-frames 3000

      - name: Reject a corrupt replay
        shell: bash
        run: |
          head -c 128 tests/fixtures/larva_vs_mini.rep > artifacts/corrupt.rep
          set +e
          extractor/headless/target/release/scai-headless-extractor             --replay artifacts/corrupt.rep             --output artifacts/should-not-exist.jsonl             --synthetic
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "corrupt replay unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync CPU environment
        run: uv sync --locked --extra cpu --group dev

      - name: Validate TransitionV1 output
        run: |
          uv run --extra cpu scai inspect-data artifacts/first.jsonl
          uv run --extra cpu scai audit-data artifacts/first.jsonl
          uv run --extra cpu scai compare-extractions artifacts/first.jsonl artifacts/second.jsonl
          uv run --extra cpu scai benchmark-data artifacts/first.jsonl --repeats 2
          uv run --extra cpu scai pack-data artifacts/first.jsonl artifacts/first.npz

      - name: Assert synthetic fidelity cannot be mistaken for benchmark data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/first.manifest.json").read_text())
          assert manifest["fidelity"] == "synthetic-ci"
          assert manifest["scientific_use"].startswith("pipeline-validation-only")
          assert manifest["emitted_transitions"] > 0
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload extraction diagnostics
        uses: actions/upload-artifact@v7.0.1
        with:
          name: headless-real-replay-validation
          path: |
            artifacts/*.manifest.json
            artifacts/*.npz
          retention-days: 7
          if-no-files-found: error
