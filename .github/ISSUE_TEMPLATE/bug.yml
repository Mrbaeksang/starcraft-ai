name: Bug / engineering issue
description: Report a reproducible defect or bounded engineering task
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or steps.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, CUDA, GPU, BWAPI/runtime if relevant.
