[project]
name = "starcraft-ai"
version = "0.1.0"
description = "Open research framework for latent world models and planning in StarCraft: Brood War."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sanghyeon Baek" }]
keywords = ["starcraft", "brood-war", "reinforcement-learning", "world-model", "jepa", "model-based-rl", "pytorch"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.1,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
cpu = ["torch>=2.14,<2.15"]
cu130 = ["torch>=2.14,<2.15"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[project.scripts]
scai = "starcraft_ai.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starcraft_ai"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
